# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more

# SUPER key
$mainMod = SUPER
# Rofi
bindr = SUPER, SUPER_L, exec, ~/.config/scripts/toggle-launcher.sh # Menu
bind = $mainMod, I, exec,~/.config/rofi/wifi-menu.sh # Wifi menu 
bind = $mainMod SHIFT, I, exec, rofi -show window # Window menu
bind = $mainMod, K, exec, ~/.config/scripts/keybindings.sh # Keybinds menu
# Applications
bind = $mainMod,T, exec, kitty # Terminal
bind = $mainMod, A, exec, ~/.config/scripts/open_web_app.sh https://gemini.google.com/ # Ai: Gemini
bind = $mainMod, E, exec, thunar # File manager
bind = $mainMod SHIFT, A, exec, pavucontrol # Audio
bind = $mainMod, B, exec, google-chrome-stable # Browser: Google Chrome 
bind = $mainMod, G, exec, ~/.config/scripts/open_web_app.sh https://mail.google.com/ # Gmail
bind = $mainMod SHIFT, B, exec, blueman-manager # Bluetooth



# Navigation (Windows)
bind = $mainMod, Q, killactive # Close active window
bind = $mainMod, Tab, cyclenext, # Focus next window 
bind = $mainMod SHIFT, Tab, cyclenext, prev # Focus previous window
bind = $mainMod ALT, Tab, layoutmsg, swapnext # Move to next window
bind = $mainMod SHIFT ALT, Tab, layoutmsg, swapprev # Move to previous window

# Navigation (Workspace)
bind = $mainMod, W, workspace, r+1 # Focus next workspace
bind = $mainMod SHIFT, W, workspace, r-1 # Focus previous workspace
bind = $mainMod ALT,W, movetoworkspace, r+1 # Move window to next workspace
bind = $mainMod SHIFT ALT,W, movetoworkspace, r-1 # Move window to previous workspace
bind = $mainMod, mouse_down, workspace, e+1 # Scroll next workspaces 
bind = $mainMod, mouse_up, workspace, e-1 # Scroll previous workspaces

# Navigation (Display)

bind = $mainMod, D, focusmonitor, +1 # Focus next display
bind = $mainMod SHIFT, D, focusmonitor, -1 # Focus previous display
bind = $mainMod ALT, D, movewindow, mon:+1 # Move window to next display
bind = $mainMod SHIFT ALT, D, movewindow, mon:-1 # Move window to previous display
bind = $mainMod CONTROL, D, movecurrentworkspacetomonitor, +1 # Move workspace to next display
bind = $mainMod SHIFT CONTROL, D, movecurrentworkspacetomonitor, -1 # Move workspace to previous display

# Window Sizes
bind = $mainMod, M, exec, ~/.config/scripts/master_toggle.py # Move to master window
bind = $mainMod SHIFT, M, fullscreen, 1 # Maximize window
bind = $mainMod ALT, M, fullscreen, 0 # Fullscreen window

bind = $mainMod, left, resizeactive, -100 0 # Resize window left
bind = $mainMod, right, resizeactive, 100 0 # Resize window right
bind = $mainMod, up, resizeactive, 0 -100 # Resize window up
bind = $mainMod, down, resizeactive, 0 100 # Resize window down

bind = $mainMod SHIFT, left, resizeactive, -10 0 # Resize window left small
bind = $mainMod SHIFT, right, resizeactive, 10 0 # Resize window right small
bind = $mainMod SHIFT, up, resizeactive, 0 -10 # Resize window up small
bind = $mainMod SHIFT, down, resizeactive, 0 10 # Resize window down small

# Actions
bind = $mainMod, escape, exec, hyprlock # Lock screen
bind = $mainMod, P, exec,wlogout -b 4 #-s # Show logout menu
bind = $mainMod, S, exec, ~/.config/scripts/screenshot.sh --region # Screenshot region
bind = $mainMod SHIFT, S, exec, ~/.config/scripts/screenshot.sh --window # Screenshot window
bind = $mainMod ALT, S, exec, ~/.config/scripts/screenshot.sh --fullscreen # Screenshot fullscreen
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+ # Increase volume
bind = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%- # Decrease volume
bind = , XF86MonBrightnessUp, exec, brightnessctl set 10%+ # Increase screen brightness
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%- # Decrease screen brightness
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # Mute/unmute audio
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle # Mute/unmute microphone
bind = , XF86WLAN, exec, nmcli radio wifi toggle # Toggle Wi-Fi
bind = , XF86Refresh, exec, xdotool key F5 # Refresh active window (sends F5)

# Triggered when the lid is closed
bindl=,switch:on:Lid Switch, exec, loginctl lock-session

# Triggered when the lid is opened
bindl=,switch:off:Lid Switch, exec, hyprctl dispatch dpms on

# Navigate workspaces by number
bind = $mainMod, 1, workspace, 1 # Focus workspace 1
bind = $mainMod, 2, workspace, 2 # Focus workspace 2
bind = $mainMod, 3, workspace, 3 # Focus workspace 3
bind = $mainMod, 4, workspace, 4 # Focus workspace 4
bind = $mainMod, 5, workspace, 5 # Focus workspace 5
bind = $mainMod, 6, workspace, 6 # Focus workspace 6
bind = $mainMod, 7, workspace, 7 # Focus workspace 7
bind = $mainMod, 8, workspace, 8 # Focus workspace 8
bind = $mainMod, 9, workspace, 9 # Focus workspace 9
bind = $mainMod, 0, workspace, 10 # Focus workspace 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1 #  Move window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 #  Move window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 #  Move window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 #  Move window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 #  Move window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 #  Move window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 #  Move window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 #  Move window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 #  Move window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 #  Move window to workspace 10


